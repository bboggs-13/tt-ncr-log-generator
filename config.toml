# TT brand theme — Anthropic-inspired warm light look
# Olive #8B9064 (R139 G144 B100), Terra cotta #D4451D (R212 G69 B29),
# cool-gray body text #76767B (R118 G118 B123).
[theme]
base = "light"
primaryColor = "#D4451D"                 # terra cotta — interactive elements & highlights
backgroundColor = "#FAF9F5"              # warm off-white (Anthropic cream)
secondaryBackgroundColor = "#F0EDE4"     # deeper warm neutral for widgets/cards
textColor = "#76767B"                    # cool gray body text
linkColor = "#8B9064"                    # olive links
font = "sans-serif"
baseRadius = "small"
borderColor = "#E4DFD3"                  # soft warm border
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#F0EDE4"
